name: Deploy HCCNA to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  APP_DIR: /var/www/hccna
  APP_NAME: hccna
  APP_PORT: 3000
  APP_DOMAIN: hccna.online

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_* values are baked into the browser bundle at build time. If any is
      # empty the build still succeeds, but the client Supabase client throws on
      # load and the header renders no Sign in button. Fail here instead.
      - name: Verify client build variables
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Set it under Settings -> Secrets and variables -> Actions."
              missing=1
            else
              echo "$name: OK"
            fi
          done
          test "$missing" -eq 0

      - name: Build application
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: npm run build

      # Prove the Supabase URL actually reached the browser bundle. If this fails,
      # the values were present but Vite did not inline them.
      - name: Verify Supabase reached the client bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          host=$(echo "$VITE_SUPABASE_URL" | sed -E 's#^https?://##; s#/.*##')
          echo "Looking for '$host' in .output/public ..."
          if grep -rq -- "$host" .output/public; then
            echo "Supabase URL is present in the client bundle."
          else
            echo "::error::The Supabase URL is missing from the client bundle - sign-in will not work."
            exit 1
          fi

      - name: Verify Nitro build
        run: |
          echo "Checking .output..."

          test -d .output
          test -d .output/public
          test -d .output/server
          test -f .output/server/index.mjs

          echo ""
          echo "===== SERVER BUILD ====="
          ls -la .output/server

          echo ""
          echo "===== PUBLIC BUILD ====="
          ls -la .output/public

          echo ""
          echo "Nitro build verified successfully."

      - name: Upload complete production build
        uses: actions/upload-artifact@v4
        with:
          name: hccna-production
          path: .output/
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download complete production build
        uses: actions/download-artifact@v4
        with:
          name: hccna-production
          path: .output

      - name: Verify downloaded server
        run: |
          echo "===== DOWNLOADED BUILD ====="
          find .output -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "Checking Nitro server..."

          test -f .output/server/index.mjs

          echo "Nitro server found:"
          ls -lh .output/server/index.mjs

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'"

      - name: Prepare EC2 application directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo mkdir -p ${{ env.APP_DIR }} && sudo chown -R $EC2_USER:$EC2_USER ${{ env.APP_DIR }}"

      - name: Deploy complete Nitro build
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync \
            -avz \
            --delete \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes" \
            .output/ \
            "$EC2_USER@$EC2_HOST:${{ env.APP_DIR }}/.output/"

      - name: Verify Nitro server on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "test -f ${{ env.APP_DIR }}/.output/server/index.mjs && echo 'Nitro server successfully deployed'"

      - name: Install PM2 if needed
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "command -v pm2 >/dev/null 2>&1 || sudo npm install -g pm2"

      - name: Stop previous HCCNA process
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 delete ${{ env.APP_NAME }} >/dev/null 2>&1 || true"

      - name: Start Nitro server with PM2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

          # Server-side Supabase variables
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

          # Client/build Supabase variables
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

          # Square (server-side only). If these are absent the app falls back to
          # Stripe automatically, so the deploy still succeeds without them.
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
          SQUARE_WEBHOOK_URL: ${{ secrets.SQUARE_WEBHOOK_URL }}
          PAYMENT_PROVIDER: ${{ secrets.PAYMENT_PROVIDER }}

          # Stripe (kept as the fallback processor)
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

        run: |
          echo "Starting HCCNA on EC2..."

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "cd ${{ env.APP_DIR }} && \
            export SUPABASE_URL='$SUPABASE_URL' && \
            export SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' && \
            export SUPABASE_PUBLISHABLE_KEY='$SUPABASE_PUBLISHABLE_KEY' && \
            export VITE_SUPABASE_PROJECT_ID='$VITE_SUPABASE_PROJECT_ID' && \
            export VITE_SUPABASE_PUBLISHABLE_KEY='$VITE_SUPABASE_PUBLISHABLE_KEY' && \
            export VITE_SUPABASE_URL='$VITE_SUPABASE_URL' && \
            export SQUARE_ACCESS_TOKEN='$SQUARE_ACCESS_TOKEN' && \
            export SQUARE_LOCATION_ID='$SQUARE_LOCATION_ID' && \
            export SQUARE_ENVIRONMENT='$SQUARE_ENVIRONMENT' && \
            export SQUARE_WEBHOOK_SIGNATURE_KEY='$SQUARE_WEBHOOK_SIGNATURE_KEY' && \
            export SQUARE_WEBHOOK_URL='$SQUARE_WEBHOOK_URL' && \
            export PAYMENT_PROVIDER='$PAYMENT_PROVIDER' && \
            export STRIPE_SECRET_KEY='$STRIPE_SECRET_KEY' && \
            export STRIPE_WEBHOOK_SECRET='$STRIPE_WEBHOOK_SECRET' && \
            export PORT='${{ env.APP_PORT }}' && \
            export HOST='127.0.0.1' && \
            echo 'Checking required runtime variables...' && \
            test -n \"\$SUPABASE_URL\" && echo 'SUPABASE_URL: OK' && \
            test -n \"\$SUPABASE_SERVICE_ROLE_KEY\" && echo 'SUPABASE_SERVICE_ROLE_KEY: OK' && \
            test -n \"\$VITE_SUPABASE_URL\" && echo 'VITE_SUPABASE_URL: OK' && \
            if [ -n \"\$SQUARE_ACCESS_TOKEN\" ] && [ -n \"\$SQUARE_LOCATION_ID\" ]; then echo 'Payments: Square'; else echo 'Payments: Stripe fallback (Square secrets not set)'; fi && \
            pm2 start .output/server/index.mjs \
              --name '${{ env.APP_NAME }}' \
              --cwd '${{ env.APP_DIR }}' \
              --update-env && \
            pm2 save"

      - name: Verify PM2 environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^SUPABASE_SERVICE_ROLE_KEY:' && echo 'SUPABASE_SERVICE_ROLE_KEY: PRESENT'"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^SUPABASE_URL:' && echo 'SUPABASE_URL: PRESENT'"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^VITE_SUPABASE_URL:' && echo 'VITE_SUPABASE_URL: PRESENT'"
      # Nginx is configured ONCE. After certbot runs it owns this file (443 block,
      # certificate paths, HTTP->HTTPS redirect), so overwriting it on every deploy
      # would silently tear TLS down again. Delete the file on the server if you
      # ever want this step to regenerate a fresh HTTP-only config.
      - name: Configure Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          cat > nginx-hccna.conf <<EOF
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name ${{ env.APP_DOMAIN }} www.${{ env.APP_DOMAIN }};

              location / {
                  proxy_pass http://127.0.0.1:${{ env.APP_PORT }};
                  proxy_http_version 1.1;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;

                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection upgrade;
              }
          }
          EOF

          scp \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            nginx-hccna.conf \
            "$EC2_USER@$EC2_HOST:/tmp/hccna-nginx.conf"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "if sudo test -f /etc/nginx/sites-available/hccna; then \
               echo 'Nginx config already present - leaving it untouched so any TLS setup survives.'; \
               rm -f /tmp/hccna-nginx.conf; \
             else \
               echo 'No nginx config found - installing the initial HTTP config.'; \
               sudo mv /tmp/hccna-nginx.conf /etc/nginx/sites-available/hccna; \
             fi && \
             sudo ln -sf /etc/nginx/sites-available/hccna /etc/nginx/sites-enabled/hccna && \
             sudo rm -f /etc/nginx/sites-enabled/default && \
             sudo nginx -t && \
             sudo systemctl reload nginx"

          rm -f nginx-hccna.conf

      - name: Verify PM2 environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^SUPABASE_SERVICE_ROLE_KEY:' && echo 'SUPABASE_SERVICE_ROLE_KEY: PRESENT'"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^SUPABASE_URL:' && echo 'SUPABASE_URL: PRESENT'"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^VITE_SUPABASE_URL:' && echo 'VITE_SUPABASE_URL: PRESENT'"
      - name: Configure Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          cat > nginx-hccna.conf <<EOF
          server {
              listen 80;
              listen [::]:80;

              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:${{ env.APP_PORT }};
                  proxy_http_version 1.1;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;

                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection upgrade;
              }
          }
          EOF

          scp \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            nginx-hccna.conf \
            "$EC2_USER@$EC2_HOST:/tmp/hccna-nginx.conf"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo mv /tmp/hccna-nginx.conf /etc/nginx/sites-available/hccna && \
             sudo ln -sf /etc/nginx/sites-available/hccna /etc/nginx/sites-enabled/hccna && \
             sudo rm -f /etc/nginx/sites-enabled/default && \
             sudo nginx -t && \
             sudo systemctl reload nginx"

          rm -f nginx-hccna.conf

      - name: Verify PM2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 status ${{ env.APP_NAME }}"

      - name: Verify application on port 3000
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          sleep 5

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "curl -f -I --max-time 15 http://127.0.0.1:${{ env.APP_PORT }}"

      - name: Show application errors if verification fails
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 status && pm2 logs ${{ env.APP_NAME }} --lines 50 --nostream || true"

      - name: Verify Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "curl -sS -o /dev/null -w 'nginx responded %{http_code}\n' --max-time 15 http://127.0.0.1"

      - name: Deployment complete
        run: |
          echo "========================================="
          echo "HCCNA deployment completed successfully"
          echo "========================================="
          echo "Application: https://${{ env.APP_DOMAIN }}"