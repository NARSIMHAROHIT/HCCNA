name: Deploy HCCNA to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  APP_DIR: /var/www/hccna
  APP_NAME: hccna
  APP_PORT: 3000

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: npm run build

      - name: Verify Nitro build
        run: |
          echo "Checking .output..."

          test -d .output
          test -d .output/public
          test -d .output/server
          test -f .output/server/index.mjs

          echo ""
          echo "===== SERVER BUILD ====="
          ls -la .output/server

          echo ""
          echo "===== PUBLIC BUILD ====="
          ls -la .output/public

          echo ""
          echo "Nitro build verified successfully."

      - name: Upload complete production build
        uses: actions/upload-artifact@v4
        with:
          name: hccna-production
          path: .output/
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download complete production build
        uses: actions/download-artifact@v4
        with:
          name: hccna-production
          path: .output

      - name: Verify downloaded server
        run: |
          echo "===== DOWNLOADED BUILD ====="
          find .output -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "Checking Nitro server..."

          test -f .output/server/index.mjs

          echo "Nitro server found:"
          ls -lh .output/server/index.mjs

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'"

      - name: Prepare EC2 application directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo mkdir -p ${{ env.APP_DIR }} && sudo chown -R $EC2_USER:$EC2_USER ${{ env.APP_DIR }}"

      - name: Deploy complete Nitro build
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync \
            -avz \
            --delete \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes" \
            .output/ \
            "$EC2_USER@$EC2_HOST:${{ env.APP_DIR }}/.output/"

      - name: Verify Nitro server on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "test -f ${{ env.APP_DIR }}/.output/server/index.mjs && echo 'Nitro server successfully deployed'"

      - name: Install PM2 if needed
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "command -v pm2 >/dev/null 2>&1 || sudo npm install -g pm2"

      - name: Stop previous HCCNA process
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 delete ${{ env.APP_NAME }} >/dev/null 2>&1 || true"

      - name: Start Nitro server with PM2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

          # Server-side Supabase variables
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

          # Client/build Supabase variables
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

        run: |
          echo "Starting HCCNA on EC2..."

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "cd ${{ env.APP_DIR }} && \
            export SUPABASE_URL='$SUPABASE_URL' && \
            export SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' && \
            export SUPABASE_PUBLISHABLE_KEY='$SUPABASE_PUBLISHABLE_KEY' && \
            export VITE_SUPABASE_PROJECT_ID='$VITE_SUPABASE_PROJECT_ID' && \
            export VITE_SUPABASE_PUBLISHABLE_KEY='$VITE_SUPABASE_PUBLISHABLE_KEY' && \
            export VITE_SUPABASE_URL='$VITE_SUPABASE_URL' && \
            export PORT='${{ env.APP_PORT }}' && \
            export HOST='127.0.0.1' && \
            echo 'Checking required runtime variables...' && \
            test -n \"\$SUPABASE_URL\" && echo 'SUPABASE_URL: OK' && \
            test -n \"\$SUPABASE_SERVICE_ROLE_KEY\" && echo 'SUPABASE_SERVICE_ROLE_KEY: OK' && \
            test -n \"\$VITE_SUPABASE_URL\" && echo 'VITE_SUPABASE_URL: OK' && \
            pm2 start .output/server/index.mjs \
              --name '${{ env.APP_NAME }}' \
              --cwd '${{ env.APP_DIR }}' \
              --update-env && \
            pm2 save"

      - name: Verify PM2 environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^SUPABASE_SERVICE_ROLE_KEY:' && echo 'SUPABASE_SERVICE_ROLE_KEY: PRESENT'"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^SUPABASE_URL:' && echo 'SUPABASE_URL: PRESENT'"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 env 0 | grep -q '^VITE_SUPABASE_URL:' && echo 'VITE_SUPABASE_URL: PRESENT'"
      - name: Configure Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          cat > nginx-hccna.conf <<EOF
          server {
              listen 80;
              listen [::]:80;

              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:${{ env.APP_PORT }};
                  proxy_http_version 1.1;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;

                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection upgrade;
              }
          }
          EOF

          scp \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            nginx-hccna.conf \
            "$EC2_USER@$EC2_HOST:/tmp/hccna-nginx.conf"

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo mv /tmp/hccna-nginx.conf /etc/nginx/sites-available/hccna && \
             sudo ln -sf /etc/nginx/sites-available/hccna /etc/nginx/sites-enabled/hccna && \
             sudo rm -f /etc/nginx/sites-enabled/default && \
             sudo nginx -t && \
             sudo systemctl reload nginx"

          rm -f nginx-hccna.conf

      - name: Verify PM2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 status ${{ env.APP_NAME }}"

      - name: Verify application on port 3000
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          sleep 5

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "curl -f -I --max-time 15 http://127.0.0.1:${{ env.APP_PORT }}"

      - name: Show application errors if verification fails
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "pm2 status && pm2 logs ${{ env.APP_NAME }} --lines 50 --nostream || true"

      - name: Verify Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "curl -f -I --max-time 15 http://127.0.0.1"

      - name: Deployment complete
        run: |
          echo "========================================="
          echo "HCCNA deployment completed successfully"
          echo "========================================="
          echo "Application: http://${{ secrets.EC2_HOST }}"